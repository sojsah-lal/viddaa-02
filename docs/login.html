<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vidda Login</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 680px; margin: 48px auto; padding: 0 16px; line-height: 1.6; color: #1b1b22; background: #fff; }
  input { font: inherit; width: 100%; box-sizing: border-box; padding: 10px; margin: 8px 0 16px; }
  button { font: inherit; padding: 10px 18px; cursor: pointer; }
</style>
</head>
<body>
<h1>Connect TikTok to Vidda</h1>
<p>Paste your TikTok app's <strong>Client key</strong> (not the secret), then log in and approve.
The next page shows a one-time code for the <em>tiktok-login</em> workflow.</p>
<label for="k">Client key</label>
<input id="k" autocomplete="off" spellcheck="false">
<button id="go">Log in with TikTok</button>
<script>
  const redirect = new URL("callback.html", location.href).href;
  document.getElementById("go").onclick = () => {
    const key = document.getElementById("k").value.trim();
    if (!key) return;
    const state = crypto.randomUUID();
    try { sessionStorage.setItem("vidda_state", state); } catch (e) {}
    const u = new URL("https://www.tiktok.com/v2/auth/authorize/");
    u.search = new URLSearchParams({ client_key: key, response_type: "code",
      scope: "user.info.basic,video.upload", redirect_uri: redirect, state }).toString();
    location.href = u.href;
  };
</script>
</body>
</html>
