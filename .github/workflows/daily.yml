name: daily-video

on:
  schedule:
    - cron: "0 11 * * *"   # 18:00 Asia/Bangkok
  workflow_dispatch:
    inputs:
      format:
        description: "Force a format (blank = auto)"
        required: false
        default: ""
      no_publish:
        description: "Render only, skip TikTok upload"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-video
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Install Claude Code (only when LLM_PROVIDER=claude)
        if: vars.LLM_PROVIDER == 'claude'
        run: npm install -g @anthropic-ai/claude-code

      - name: Plan, render, QA, publish
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.format }}" ]; then ARGS="$ARGS --format ${{ inputs.format }}"; fi
          if [ "${{ inputs.no_publish }}" = "true" ]; then ARGS="$ARGS --no-publish"; fi
          python run.py $ARGS

      - name: Upload video artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_number }}
          path: |
            output/*.mp4
            output/config.json
            output/caption.txt
          retention-days: 14
          if-no-files-found: warn

      - name: Commit history.json
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.json
          if git diff --cached --quiet; then echo "history unchanged"; exit 0; fi
          git commit -m "chore: history $(TZ=Asia/Bangkok date +%F) [skip ci]"
          git pull --rebase --quiet
          git push
